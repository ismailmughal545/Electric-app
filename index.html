  names.forEach(n=>{const r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid #e6ebf0';const t=document.createElement('div');t.style.cssText='flex:1;min-width:0';t.innerHTML='<b style="font-size:14px;word-break:break-word"></b><br><small style="color:#64748b"></small>';t.querySelector('b').textContent=n;t.querySelector('small').textContent=new Date(L[n].time).toLocaleString();
   const o=document.createElement('button');o.textContent='Open';o.className='primary';o.style.margin='0';o.onclick=()=>{try{loadProject(L[n].data);projName=n;ov.style.display='none';toast('Opened: '+n)}catch{toast('Could not open this project')}};
   const d=document.createElement('button');d.textContent='Delete';d.style.margin='0';let armed=false;d.onclick=()=>{if(!armed){armed=true;d.textContent='Sure?';d.style.background='#fecaca';return}const X=getLib();delete X[n];putLib(X);r.remove();toast('Deleted: '+n)};
   r.appendChild(t);r.appendChild(o);r.appendChild(d);box.appendChild(r)})})}
function shareBlob(blob,name,mime){try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return true}}catch{}return false}
let lastSave={ok:true,empty:false};
function outputSheet(isImg,blob,name,mime,payload){show(`<h3>${isImg?'Image ready':'Saved in the app ✓ — now download a copy'}</h3><p style="font-size:12px;color:#64748b;margin:0 0 4px">${name}</p>${isImg?'':`<p id="saveState" style="font-size:14px;font-weight:600;margin:0 0 8px;color:${lastSave.ok?'#15803d':'#b91c1c'}">${(lastSave.ok?'✓ Saved inside the app (Open → My projects)':'✗ Could not save inside the app — storage is blocked here. Use Copy text below and keep it in a notes app.')+(lastSave.empty?' ⚠ The canvas is EMPTY (0 objects) — this save is blank. Draw something first.':'')}</p>`}`+(isImg?`<img src="${payload}" style="max-width:100%;max-height:230px;display:block;margin:0 auto 6px;border:1px solid #dde3ea;border-radius:10px;background:#fff"><p style="font-size:12px;color:#475569;margin:4px 0">Tap “Download to Downloads”, then confirm “Download file”.</p>`:`<textarea readonly id="outTxt" rows="4" style="width:100%;font-size:12px;font-family:monospace;padding:8px;border:1px solid #cdd5de;border-radius:10px">${payload.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>`)+`<div class="row"><button class="primary" id="oDl" style="flex:1 1 100%;padding:14px;font-size:16px">⬇ Download to Downloads</button>${isImg?'':'<button id="oCopy">📋 Copy text</button>'}<button id="close">Close</button></div>`,(sh,ov)=>{
 const c=sh.querySelector('#oCopy');if(c)c.onclick=()=>{const t=payload;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Project text copied'),()=>{const x=sh.querySelector('#outTxt');x.select();document.execCommand('copy');toast('Project text copied')});else{const x=sh.querySelector('#outTxt');x.select();try{document.execCommand('copy')}catch{}toast('Project text copied')}};
 sh.querySelector('#oDl').onclick=()=>{if(DLCAP){dlog('Save: using Claude downloads capability for '+name);DLCAP.save({filename:name,data:blob}).then(r=>{dlog('downloads.save -> '+r.status);toast('Saved: '+name)},e=>{const c=e&&e.code;dlog('downloads.save failed: '+c+' '+(e&&e.message));toast(c==='declined'?'Save cancelled':'Save failed: '+(c||'error'))});return}const fallback=()=>{try{downloadBlob(blob,name);toast('Download requested: '+name+' — confirm in the dialog')}catch{toast('Download not supported in this app')}};
 if(window.showSaveFilePicker){dlog('Save: trying showSaveFilePicker for '+name);try{const ext='.'+name.split('.').pop();window.showSaveFilePicker({suggestedName:name,types:[{description:isImg?'Image':'Create Panel project',accept:{[mime]:[ext]}}]}).then(h=>h.createWritable()).then(w=>w.write(blob).then(()=>w.close())).then(()=>{dlog('Save: picker wrote '+name);toast('Saved: '+name)},e=>{dlog('Save: picker '+e.name+': '+e.message);if(e.name==='AbortError'){toast('Save cancelled');return}fallback()})}catch(e){dlog('Save: picker exception '+e.message);fallback()}}else fallback()}})}
function saveImage(kind,share){const cv=renderImage(kind==='pngt');if(!cv)return;const jpg=kind==='jpg',mime=jpg?'image/jpeg':'image/png',name=safeName(projName)+(jpg?'.jpg':'.png');
 cv.toBlob(b=>{if(!b){toast('Could not create image');return}if(share&&shareBlob(b,name,mime))return;outputSheet(true,b,name,mime,cv.toDataURL(mime,.92))},mime,.92)}
function saveProject(){askText('Project name',projName,'Save',n=>{projName=safeName(n)||projName;const txt=JSON.stringify(projectData(),null,2),blob=new Blob([txt],{type:'application/json'}),L=getLib();L[projName]={time:Date.now(),data:txt};dlog('Save project "'+projName+'" ('+txt.length+' chars)');let ok=putLib(L);if(ok){try{ok=!!getLib()[projName]}catch{ok=false}}lastSave={ok,empty:!items.length};dlog('In-app save result: '+(ok?'OK':'FAILED'));toast(ok?'Saved in app: '+projName:'Could not save inside the app');setTimeout(()=>outputSheet(false,blob,projName+'.json','application/json',txt),30)})}
function openProject(){const inp=document.createElement('input');inp.type='file';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onerror=()=>toast('Could not read this file — try Paste text or From device');rd.onload=()=>{try{loadProject(String(rd.result));if(!/"name"/.test(rd.result))projName=safeName(f.name.replace(/\.[^.]+$/,''));toast('Opened: '+f.name)}catch{toast('This is not a Create Panel project file')}};rd.readAsText(f)};try{inp.click()}catch{toast('File picker not available — use Paste text')}}

function pasteProject(){show('<h3>Open from text</h3><p style="font-size:12px;color:#64748b;margin:0 0 6px">Paste the project text you copied with “Copy project text”.</p><textarea id="pasteIn" rows="6" style="width:100%;font-size:13px;font-family:monospace;padding:8px;border:1px solid #cdd5de;border-radius:10px"></textarea><div class="row"><button class="primary" id="pasteOk">Open</button><button id="close">Cancel</button></div>',(sh,ov)=>{sh.querySelector('#pasteOk').onclick=()=>{try{loadProject(sh.querySelector('#pasteIn').value);ov.style.display='none';toast('Project opened')}catch{toast('That text is not a valid project')}}})}
function copyProject(){const t=JSON.stringify(projectData());const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();toast(ok?'Project text copied':'Copy failed')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Project text copied'),fb);else fb()}
function openMenu(){show('<h3>Open Project</h3><button class="primary" id="oLib">🗂 My projects (saved in app)</button><button id="oFile">📂 From file</button><button id="oDev">📱 From device (last saved)</button><button id="oPaste">📋 Paste project text</button><button id="close">Close</button>',(sh,ov)=>{const on=(id,fn)=>sh.querySelector('#'+id).onclick=()=>{ov.style.display='none';setTimeout(fn,30)};on('oLib',openLibrary);on('oFile',openProject);on('oDev',loadDevice);on('oPaste',pasteProject)})}
function newProject(){show('<h3>New Project</h3><p style="font-size:13px;color:#64748b">Start a blank canvas? Unsaved work will be lost (you can still undo).</p><div class="row"><button class="danger" id="npOk">New Project</button><button id="close">Cancel</button></div>',(sh,ov)=>{sh.querySelector('#npOk').onclick=()=>{snap();items=[];sel=-1;projName='My Panel';ov.style.display='none';draw()}})}
function saveDevice(){try{localStorage.setItem('createPanelDrawing',JSON.stringify(projectData()));toast('Saved on this device')}catch{toast('Could not save on this device')}}
function loadDevice(){try{const t=localStorage.getItem('createPanelDrawing');if(!t){toast('Nothing saved on this device yet');return}loadProject(t);toast('Loaded from device')}catch{toast('Could not load saved project')}}
function gridMenu(){askText('Grid spacing (px)',grid,'Set',v=>{if(+v>2){grid=+v;applyGrid()}},'number')}
function fileMenu(title,full){const B=(id,l)=>`<button id="${id}">${l}</button>`;show(`<h3>${title}</h3>`+(full?B('fNew','🆕 New Project')+B('fOpen','📂 Open Project…')+B('fCopy','📋 Copy project text')+B('fSaveP','💾 Save Project (.json)'):B('fSaveP','💾 Save Project (.json)'))+B('fPng','🖼 Save Image — PNG')+B('fJpg','🖼 Save Image — JPG')+B('fPngT','🏁 Save Image — transparent PNG')+(full?B('fDev','📱 Save on this device')+B('fLoadDev','🔄 Load from device')+B('fGrid','▦ Grid Size'):'')+B('close','Close'),(sh,ov)=>{const on=(id,fn)=>{const b=sh.querySelector('#'+id);if(b)b.onclick=()=>{ov.style.display='none';setTimeout(fn,30)}};on('fNew',newProject);on('fOpen',openMenu);on('fCopy',copyProject);on('fSaveP',saveProject);on('fPng',()=>saveImage('png'));on('fJpg',()=>saveImage('jpg'));on('fPngT',()=>saveImage('pngt'));on('fShare',()=>saveImage('png',true));on('fDev',saveDevice);on('fLoadDev',loadDevice);on('fGrid',gridMenu);})}

/* ===== Debug panel ===== */
const DBG=[];let dbgBox=null;
function dlog(m){const t=new Date().toLocaleTimeString();DBG.push('['+t+'] '+m);if(DBG.length>200)DBG.shift();if(dbgBox){dbgBox.textContent=DBG.join('\n');dbgBox.scrollTop=dbgBox.scrollHeight}}
window.addEventListener('error',e=>dlog('JS ERROR: '+e.message+' @'+(e.lineno||'?')));
window.addEventListener('unhandledrejection',e=>dlog('PROMISE ERROR: '+(e.reason&&e.reason.message||e.reason)));
document.addEventListener('securitypolicyviolation',e=>dlog('CSP BLOCKED: '+e.violatedDirective+' -> '+String(e.blockedURI).slice(0,60)));
const _dl=downloadBlob;downloadBlob=function(b,n){dlog('downloadBlob('+n+', '+(b&&b.size)+' bytes, '+(b&&b.type)+')');try{_dl(b,n);dlog('anchor click dispatched (no JS exception)')}catch(e){dlog('downloadBlob threw: '+e.message);throw e}};
function envReport(){const L=[];const T=(k,f)=>{try{L.push(k+': '+f())}catch(e){L.push(k+': ERROR '+e.message)}};
 T('Page URL',()=>location.protocol+'//'+(location.host||'(none)')+location.pathname.slice(-30));
 T('Inside iframe',()=>String(self!==top));
 T('Sandbox attr',()=>{try{return window.frameElement?String(window.frameElement.sandbox):'(no frameElement)'}catch(e){return 'blocked: '+e.name}});
 T('localStorage',()=>{localStorage.setItem('__t','1');const v=localStorage.getItem('__t');localStorage.removeItem('__t');return v==='1'?'WORKS':'read-back failed'});
 T('Saved projects',()=>{const l=getLib();const n=Object.keys(l);return n.length+' ('+n.join(', ')+')'});
 T('Library size',()=>(localStorage.getItem(LIBKEY)||'').length+' chars');
 T('indexedDB',()=>String(!!window.indexedDB));
 T('a[download] supported',()=>String('download' in HTMLAnchorElement.prototype));
 T('Blob URL create',()=>{const u=URL.createObjectURL(new Blob(['x']));URL.revokeObjectURL(u);return 'OK ('+u.slice(0,30)+'…)'});
 T('navigator.share',()=>String(!!navigator.share));
 T('navigator.canShare',()=>String(!!navigator.canShare));
 T('Claude downloads capability',()=>String(!!DLCAP));
 T('showSaveFilePicker',()=>String(!!window.showSaveFilePicker));
 T('clipboard.writeText',()=>String(!!(navigator.clipboard&&navigator.clipboard.writeText)));
 T('User agent',()=>navigator.userAgent.slice(0,110));
 return L.join('\n')}
function testDownload(kind){const txt=JSON.stringify(projectData()),blob=new Blob([txt],{type:'application/json'}),name='debug-test.json';dlog('--- Test '+kind+' ---');
 try{
  if(kind==='A'){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();dlog('A: blob anchor clicked')}
  else if(kind==='B'){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);a.download=name;document.body.appendChild(a);a.click();a.remove();dlog('B: data-URL anchor clicked')}
  else if(kind==='C'){const w=window.open(URL.createObjectURL(blob),'_blank');dlog('C: window.open returned '+(w?'a window':'null (blocked)'))}
  else if(kind==='D'){const f=new File([blob],name,{type:'application/json'});if(!navigator.share){dlog('D: navigator.share missing');return}dlog('D: canShare(files)='+(navigator.canShare?navigator.canShare({files:[f]}):'n/a'));navigator.share({files:[f],title:name}).then(()=>dlog('D: share resolved'),e=>dlog('D: share rejected: '+e.name+' '+e.message))}
  else if(kind==='E'){if(!window.showSaveFilePicker){dlog('E: showSaveFilePicker missing');return}window.showSaveFilePicker({suggestedName:name}).then(h=>h.createWritable()).then(w=>w.write(blob).then(()=>w.close())).then(()=>dlog('E: file written'),e=>dlog('E: failed: '+e.name+' '+e.message))}
  else if(kind==='S'){const k='__dbg'+Date.now();localStorage.setItem(k,'hello');const ok=localStorage.getItem(k)==='hello';localStorage.removeItem(k);dlog('S: localStorage write/read '+(ok?'OK':'FAILED'))}
 }catch(e){dlog(kind+': EXCEPTION '+e.name+': '+e.message)}
 setTimeout(()=>dlog(kind+': (1.5s later) nothing else reported by the page — if no file/dialog appeared, the host app ignored it)'),1500)}
function debugPanel(){show('<h3>🐞 Debug</h3><pre id="dbgEnv" style="font-size:11px;background:#f1f5f9;border-radius:8px;padding:8px;max-height:150px;overflow:auto;white-space:pre-wrap;margin:0 0 6px"></pre><div class="row"><button id="dS">Storage test</button><button id="dA">Download A: blob</button><button id="dB">B: data URL</button><button id="dC">C: window.open</button><button id="dD">D: share file</button><button id="dE">E: save picker</button></div><div style="font-size:12px;margin:8px 0 2px;color:#475569">Live log:</div><pre id="dbgLog" style="font-size:11px;background:#0f172a;color:#d1fae5;border-radius:8px;padding:8px;height:130px;overflow:auto;white-space:pre-wrap;margin:0"></pre><div class="row"><button class="primary" id="dCopy">📋 Copy report</button><button id="dClr">Clear log</button><button id="close">Close</button></div>',(sh,ov)=>{
 sh.querySelector('#dbgEnv').textContent=envReport();dbgBox=sh.querySelector('#dbgLog');dbgBox.textContent=DBG.join('\n');
 [['dS','S'],['dA','A'],['dB','B'],['dC','C'],['dD','D'],['dE','E']].forEach(([id,k])=>sh.querySelector('#'+id).onclick=()=>testDownload(k));
 sh.querySelector('#dClr').onclick=()=>{DBG.length=0;dbgBox.textContent=''};
 sh.querySelector('#dCopy').onclick=()=>{const t='=== ENV ===\n'+envReport()+'\n=== LOG ===\n'+DBG.join('\n');const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();dlog(ok?'report copied':'copy failed')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>dlog('report copied'),fb);else fb()};
 const prevClose=sh.querySelector('#close');const oc=prevClose.onclick;prevClose.onclick=()=>{dbgBox=null;oc&&oc()};
 dlog('Debug panel opened')})}
document.querySelector('#more').onclick=()=>fileMenu('File / Settings',true);
document.querySelector('#export').onclick=()=>fileMenu('Export',false);
document.querySelector('#save').onclick=saveDevice;document.querySelector('#xNew').onclick=newProject;document.querySelector('#xOpen').onclick=openMenu;document.querySelector('#xSave').onclick=saveProject;document.querySelector('#xImg').onclick=()=>fileMenu('Save / Share Image',false);
try{let saved=localStorage.getItem('createPanelDrawing');if(saved){const d=JSON.parse(saved);items=Array.isArray(d)?d:(d.objects||[]);if(d.bgColor)bgColor=d.bgColor;if(d.grid>2)grid=d.grid;if(d.name)projName=d.name}}catch{}resize();applyGrid();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
