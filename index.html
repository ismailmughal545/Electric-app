function layerName(o){if(o.name)return o.name;if(o.type==='text'){const t=String(o.text||'').replace(/\s+/g,' ').trim();return t.length>40?t.slice(0,40)+'…':(t||'Text')}return NAMES[o.type]||String(o.type)}
function sig(){return open?items.length+'|'+sel+'|'+items.map(o=>o?(o.hidden?'h':'v')+(o.locked?'l':'u')+o.type+'\u0001'+layerName(o):'-').join('\u0002'):''}
function mk(o,k){const r=document.createElement('div');r.className='lyRow'+(k===sel?' sel':'')+(o.hidden?' off':'')+(o.locked?' lk':'');r.dataset.i=k;
 r.innerHTML='<div class="lyGrip" title="Drag to reorder">'+'<i></i>'.repeat(8)+'</div><div class="lyName"><span dir="auto"></span></div><div class="lyBtns">'+
  '<button type="button" data-a="lock" class="'+(o.locked?'on':'')+'" aria-label="'+(o.locked?'Unlock layer':'Lock layer')+'">'+(o.locked?IC.lock:IC.unlock)+'</button>'+
  '<button type="button" data-a="edit" aria-label="Edit layer">'+IC.edit+'</button>'+
  '<button type="button" data-a="hide" aria-label="'+(o.hidden?'Show layer':'Hide layer')+'">'+(o.hidden?IC.eye:IC.eyeOff)+'</button>'+
  '<button type="button" data-a="del" aria-label="Delete layer">'+IC.del+'</button></div>';
 const sp=r.querySelector('.lyName span');sp.textContent=layerName(o);
 if(o.type==='text'&&!o.name){const ur=isAr(String(o.text||''));sp.style.fontFamily=famCSS(ur?(o.fontUr===undefined?'Noto Nastaliq Urdu':o.fontUr):(o.fontEn||''),ur)}
 return r}
function render(){lastSig=sig();const st=list.scrollTop;list.innerHTML='';
 if(!items.some(Boolean)){list.innerHTML='<div class="lyEmpty">No layers yet</div>';return}
 for(let k=items.length-1;k>=0;k--)if(items[k])list.appendChild(mk(items[k],k));
 list.scrollTop=st;
 if(sel!==lastSel){lastSel=sel;const r=list.querySelector('.lyRow.sel');if(r)r.scrollIntoView({block:'nearest'})}}
function rename(o){askText('Layer name',layerName(o),'Save',v=>{v=String(v).trim().slice(0,60);snap();if(v)o.name=v;else delete o.name;draw()})}
list.addEventListener('click',e=>{const row=e.target.closest('.lyRow');if(!row)return;const k=+row.dataset.i,o=items[k];if(!o)return;
 const b=e.target.closest('button[data-a]');
 if(b){const a=b.dataset.a;
  if(a==='lock'){snap();o.locked=!o.locked;draw();return}
  if(a==='hide'){snap();o.hidden=!o.hidden;draw();return}
  if(a==='edit'){if(o.locked){toast('Layer is locked — unlock it first');return}sel=k;draw();if(o.type==='text')openTextEditor({edit:k});else properties();return}
  if(a==='del'){if(o.locked){toast('Layer is locked — unlock it first');return}snap();items.splice(k,1);if(sel===k)sel=-1;else if(sel>k)sel--;draw();return}
  return}
 const now=Date.now();
 if(e.target.closest('.lyName')&&lastName.o===o&&now-lastName.t<400){lastName={o:null,t:0};rename(o);return}
 lastName={o,t:now};
 if(sel!==k){sel=k;draw()}});
/* drag the dotted handle to reorder */
function upd(){const d=dg,n=d.rows.length;let dy=d.y-d.y0+(list.scrollTop-d.s0);dy=Math.max(-d.from*d.rh,Math.min((n-1-d.from)*d.rh,dy));
 const to=Math.max(0,Math.min(n-1,d.from+Math.round(dy/d.rh)));d.to=to;
 d.rows.forEach((r,i)=>{if(r===d.row){r.style.transform='translateY('+dy+'px)';return}let s=0;if(d.from<to&&i>d.from&&i<=to)s=-d.rh;else if(d.from>to&&i<d.from&&i>=to)s=d.rh;r.style.transform=s?'translateY('+s+'px)':''})}
function tick(){if(!dg)return;const r=list.getBoundingClientRect();if(dg.y<r.top+40)list.scrollTop-=10;else if(dg.y>r.bottom-40)list.scrollTop+=10;upd()}
function end(commit){if(!dg)return;clearInterval(timer);const d=dg;dg=null;d.rows.forEach(r=>r.style.transform='');d.row.classList.remove('drag');
 if(commit&&d.to!==d.from){const a=+d.row.dataset.i,b=+d.rows[d.to].dataset.i;snap();const so=items[sel],m=items.splice(a,1)[0];items.splice(b,0,m);sel=so?items.indexOf(so):-1;draw()}
 render()}
list.addEventListener('pointerdown',e=>{const g=e.target.closest('.lyGrip');if(!g||dg)return;e.preventDefault();
 const row=g.parentNode,rows=[...list.querySelectorAll('.lyRow')],gap=rows.length>1?rows[1].offsetTop-rows[0].offsetTop:row.offsetHeight+4;
 dg={row,rows,from:rows.indexOf(row),to:rows.indexOf(row),y0:e.clientY,y:e.clientY,s0:list.scrollTop,rh:gap,id:e.pointerId};
 try{g.setPointerCapture(e.pointerId)}catch{}
 row.classList.add('drag');clearInterval(timer);timer=setInterval(tick,16)});
list.addEventListener('pointermove',e=>{if(dg&&e.pointerId===dg.id){dg.y=e.clientY;upd()}});
list.addEventListener('pointerup',e=>{if(dg&&e.pointerId===dg.id)end(true)});
list.addEventListener('pointercancel',e=>{if(dg&&e.pointerId===dg.id)end(false)});
/* keep the panel in sync with the canvas (selection, add/delete, undo/redo, text edits) */
const _draw=draw;draw=function(){_draw.apply(this,arguments);if(open&&!dg&&sig()!==lastSig)render()};
btn.onclick=()=>{open=!open;panel.classList.toggle('open',open);btn.classList.toggle('on',open);btn.setAttribute('aria-pressed',open);if(open){lastSel=-2;render()}};
})();
try{let saved=localStorage.getItem('createPanelDrawing');if(saved){const d=JSON.parse(saved);loadImages(d);items=cleanItems(Array.isArray(d)?d:(d.objects||[]));if(typeof d.bgColor==='string'&&/^#[0-9a-fA-F]{6}$/.test(d.bgColor))bgColor=d.bgColor;if(d.grid>2)grid=d.grid;if(d.name)projName=safeName(String(d.name))}}catch{items=[]}try{resize()}catch(e){items=[];try{localStorage.removeItem('createPanelDrawing')}catch{}resize()}applyGrid();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
